name: e2e

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run against'
        type: choice
        options: [development, staging, production]
        default: development
      grep:
        description: 'Only run tests matching this tag (e.g. @smoke). Empty runs everything.'
        type: string
        default: '@smoke'
      project:
        description: 'Only run this Playwright project (frontend, admin or cfa). Empty runs every project.'
        type: string
        default: ''
      update_snapshots:
        description: 'SAN-1617: regenerate the visual baselines (runs only the visual projects; grep/project ignored). Download the visual-baselines artifact and commit it through a reviewed change.'
        type: boolean
        default: false
  # Called by the smoke check in sc-saas-frontend and sc-saas-admin (SAN-1585):
  #   uses: sanchiconnect-org/sc-saas-e2e/.github/workflows/e2e.yml@main
  # The Environment named by `environment` is looked up in the CALLING repository, so each caller needs
  # its own Environment holding the QA secrets below, and passes them in with `secrets: inherit`.
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run against (development, staging or production)'
        type: string
        default: development
      grep:
        description: 'Only run tests matching this tag. Empty runs everything.'
        type: string
        default: '@smoke'
      project:
        description: 'Only run this Playwright project (frontend, admin or cfa). Empty runs every project.'
        type: string
        default: ''
  schedule:
    # Nightly at 02:00 IST (20:30 UTC) against development (ai_native_setup)
    - cron: '30 20 * * *'

concurrency:
  group: e2e-${{ inputs.environment || 'development' }}-${{ inputs.project || 'all' }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each environment is a GitHub Environment holding its own secrets (Settings → Environments).
    environment: ${{ inputs.environment || 'development' }}
    env:
      CI: 'true'
      E2E_ENV: ${{ inputs.environment || 'development' }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      ADMIN_URL: ${{ secrets.ADMIN_URL }}
      API_URL: ${{ secrets.API_URL }}
      COCKPIT_URL: ${{ secrets.COCKPIT_URL }}
      SPOKE_URL: ${{ secrets.SPOKE_URL }}
      QA_OTP: ${{ secrets.QA_OTP }}
      QA_STARTUP_EMAIL: ${{ secrets.QA_STARTUP_EMAIL }}
      QA_INVESTOR_EMAIL: ${{ secrets.QA_INVESTOR_EMAIL }}
      QA_CORPORATE_EMAIL: ${{ secrets.QA_CORPORATE_EMAIL }}
      QA_MENTOR_EMAIL: ${{ secrets.QA_MENTOR_EMAIL }}
      QA_PARTNER_EMAIL: ${{ secrets.QA_PARTNER_EMAIL }}
      QA_SERVICE_PROVIDER_EMAIL: ${{ secrets.QA_SERVICE_PROVIDER_EMAIL }}
      QA_INDIVIDUAL_EMAIL: ${{ secrets.QA_INDIVIDUAL_EMAIL }}
      QA_PROGRAM_OFFICE_EMAIL: ${{ secrets.QA_PROGRAM_OFFICE_EMAIL }}
      QA_REGISTER_EMAIL_PATTERN: ${{ secrets.QA_REGISTER_EMAIL_PATTERN }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      QA_JURY_EMAIL: ${{ secrets.QA_JURY_EMAIL }}
      QA_JURY_PASSWORD: ${{ secrets.QA_JURY_PASSWORD }}
      # CFA regression suite (FT-006); the cfa project is skipped without QA_CFA_TEMPLATE_FORM_ID
      QA_CFA_TEMPLATE_FORM_ID: ${{ secrets.QA_CFA_TEMPLATE_FORM_ID }}
      QA_CFA_NDA_PROGRAM_ID: ${{ secrets.QA_CFA_NDA_PROGRAM_ID }}
      QA_CFA_CLOSED_PROGRAM_PATH: ${{ secrets.QA_CFA_CLOSED_PROGRAM_PATH }}
      QA_CFA_EMAIL_PATTERN: ${{ secrets.QA_CFA_EMAIL_PATTERN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        env:
          # Scheduled runs have no inputs, so GREP is empty and the full suite runs.
          GREP: ${{ inputs.grep }}
          PROJECT: ${{ inputs.project }}
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          args=()
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            args+=(--project visual-desktop --project visual-phone --update-snapshots)
          else
            if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
            if [ -n "$PROJECT" ]; then args+=(--project "$PROJECT"); fi
          fi
          npx playwright test "${args[@]}"

      - name: Upload visual baselines
        if: ${{ !cancelled() && inputs.update_snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-${{ env.E2E_ENV }}-${{ github.run_number }}
          path: tests/visual/**/*-snapshots/
          retention-days: 14

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ env.E2E_ENV }}-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload accessibility reports
        # SAN-1610: axe JSON reports written by fixtures/a11y.ts (advisory; never fails the run).
        if: ${{ !cancelled() && hashFiles('a11y-reports/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: a11y-reports-${{ env.E2E_ENV }}-${{ github.run_number }}
          path: a11y-reports/
          retention-days: 30

      - name: Upload traces and results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ env.E2E_ENV }}-${{ github.run_number }}
          path: test-results/
          retention-days: 14
